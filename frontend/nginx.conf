server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Match the backend's 5mb JSON limit (nginx default is only 1m).
    client_max_body_size 6m;

    # API + docs + queue dashboard -> backend container (Compose service name "backend").
    location /api/     { proxy_pass http://backend:5000; }
    location /api-docs { proxy_pass http://backend:5000; }
    location /admin/   { proxy_pass http://backend:5000; }

    # Single-page app: send everything else to index.html so client routing works.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
